[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "network-stack-from-scratch"
version = "0.1.0"
description = "Python interoperability clients and tests for the Java HTTP/1.1 server in network-stack-from-scratch."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A protocol bug usually shows up as a hang; fail the test instead of waiting forever.
timeout = 60

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/network_stack_from_scratch/javaserver.py" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
